services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nhatro
      POSTGRES_PASSWORD: nhatro
      POSTGRES_DB: nhatro
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://nhatro:nhatro@db:5432/nhatro
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  pgdata:
