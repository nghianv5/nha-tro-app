# Blueprint triển khai lên Render — tạo Web Service (Docker) + PostgreSQL
# và tự gắn DATABASE_URL + SECRET_KEY. Dùng: Render Dashboard → New → Blueprint
# → chọn repo chứa file này → Apply.
services:
  - type: web
    name: nhatro-web
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nhatro-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: nhatro-db
    plan: free
    databaseName: nhatro
    user: nhatro
